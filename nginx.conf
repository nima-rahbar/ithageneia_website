# Nginx Configuration Snippet for ithageneia.nimarahbar.com

server {
    listen 80;
    listen 443 ssl http2;
    server_name ithageneia.nimarahbar.com;
    root /var/www/ithageneia.nimarahbar.com;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Audio Streaming Configuration (Byte-Ranges & CORS)
    location /audio/ {
        # Enable CORS for Android apps and external browsers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Range, Accept-Ranges, Content-Type, Origin' always;
        add_header Access-Control-Expose-Headers 'Content-Range, Content-Length, Accept-Ranges' always;

        # Enable byte-range seeking
        max_ranges 512;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static Assets Caching
    location ~* \.(css|js|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Default fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

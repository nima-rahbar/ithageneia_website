# Nginx Configuration Snippet for ithageneia.nimarahbar.com

server {
    listen 80;
    listen 443 ssl http2;
    server_name ithageneia.nimarahbar.com;
    root /var/www/ithageneia.nimarahbar.com;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    # =========================================================================
    # Legacy WordPress Redirections (Clean up Search Console 404 Errors)
    # Returns HTTP 301 Moved Permanently to the homepage root
    # =========================================================================
    # 1. Legacy theme assets: /wp-content/themes/nima-studio/*
    location ~* ^/wp-content/themes/nima-studio {
        return 301 /;
    }

    # 2. Legacy WordPress admin: /wp-admin/*
    location ~* ^/wp-admin {
        return 301 /;
    }

    # 3. Additional legacy WordPress paths (content, plugins, includes, login)
    location ~* ^/wp-content {
        return 301 /;
    }

    location ~* ^/wp-includes {
        return 301 /;
    }

    location = /wp-login.php {
        return 301 /;
    }

    location = /xmlrpc.php {
        return 301 /;
    }

    # =========================================================================
    # Search Engine Crawler & Sitemap Endpoints
    # =========================================================================
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        allow all;
        log_not_found off;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Audio Streaming Configuration (Byte-Ranges, CORS & Hotlink/Direct Access Blocking)
    location /audio/ {
        # Hotlink & Direct Browser Access Protection
        # Blocks direct entry from browser address bar (empty referer) and external sites.
        # Only permits app environments and your domain.
        valid_referers server_names *.nimarahbar.com nimarahbar.com
                       ~*appassets\.androidplatform\.net
                       ~*localhost;

        if ($invalid_referer) {
            return 403;
        }

        # Enable CORS for Android apps and WebViews
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Range, Accept-Ranges, Content-Type, Origin, User-Agent, Referer' always;
        add_header Access-Control-Expose-Headers 'Content-Range, Content-Length, Accept-Ranges' always;

        # Enable byte-range seeking
        max_ranges 512;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static Assets Caching
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Default fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
